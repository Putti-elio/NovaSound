name: CI Frontend

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    frontend-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Load tool versions
              run: grep -Ev '^\s*(#|$)' project/ci/versions >> "$GITHUB_ENV"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache Bun dependencies
                uses: actions/cache@v6.1.0
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('package.json', 'bun.lock', 'package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: |
                  if [ -f bun.lock ]; then
                    bun install --frozen-lockfile
                  else
                    bun install
                  fi

            - name: Build
              run: bun run build

            # TODO: Add Nuxt support when switching from Vue.js to Nuxt
            # - name: Nuxt typecheck
            #   run: bun run typecheck
            # - name: Nuxt lint
            #   run: bun run lint
