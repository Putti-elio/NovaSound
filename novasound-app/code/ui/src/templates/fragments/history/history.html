<section class="page" aria-labelledby="history-title">
  <header class="page-heading">
    <div><p class="eyebrow">Event log</p><h1 id="history-title">Every listen, verifiable.</h1><p class="page-lede">The timeline behind the aggregates, with actual duration and provenance.</p></div>
    <div class="heading-actions"><button class="button button-secondary" type="button">Export events</button></div>
  </header>

  <form class="filter-bar" hx-get="/src/templates/fragments/history/history-evening.html" hx-target="#history-results" hx-indicator="#history-loader">
    <label><span>Search</span><input name="query" placeholder="Track, artist, or album" /></label>
    <label><span>Time</span><select name="moment"><option>All day</option><option selected>Evening · 6pm–12am</option><option>Morning · 6am–12pm</option></select></label>
    <label><span>Source</span><select name="source"><option>All</option><option>Import</option><option>Sync</option></select></label>
    <button class="button button-primary" type="submit">Filter</button>
    <button class="button button-quiet" type="button" hx-get="/src/templates/fragments/history/history-list.html" hx-target="#history-results" hx-indicator="#history-loader">Reset</button>
  </form>

  <div class="history-summary"><span><strong>6 événements affichés</strong><small>sur 1 798 dans la période</small></span><span><strong>19 min 27 s</strong><small>temps réellement écouté</small></span><span><strong>Europe/Paris</strong><small>fuseau d'affichage</small></span></div>
  <div id="history-loader" class="inline-loader htmx-indicator">Reading mock event log...</div>
  <div id="history-results" hx-get="/src/templates/fragments/history/history-list.html" hx-trigger="load" hx-indicator="#history-loader"><div class="loading-state"><p>Preparing timeline...</p></div></div>
</section>
