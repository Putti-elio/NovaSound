[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["macros"] }
axum-server = "0.7.2"
buffa = { version = "0.3", features = ["json"] }
clorinde = { path = "clorinde", features = ["deadpool"] }
connectrpc = { version = "0.3", features = ["axum", "client"] }
deadpool-postgres = "0.14"
env_logger = "0.11.8"
function_name = "0.3.0"
http-body = "1"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
tokio-postgres = "0.7"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
serde_json = "1.0"

[build-dependencies]
connectrpc-build = "0.3"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
missing_panics_doc = "warn"
wildcard_imports = "warn"
pedantic = "warn"
