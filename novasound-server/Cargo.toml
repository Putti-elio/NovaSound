[workspace]
members = [
    "code/crates/domain",
    "code/crates/application",
    "code/crates/providers",
    "code/crates/storage-postgres",
]
resolver = "3"

[package]
name = "novasound-server"
version = "0.1.0"
edition = "2024"

[lib]
path = "code/src/lib.rs"

[[bin]]
name = "novasound-server"
path = "code/src/main.rs"

[[bin]]
name = "database_setup"
path = "code/src/bin/database_setup.rs"

[dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = "0.8.0"
buffa = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.0", features = ["axum", "client"] }
deadpool-postgres = "0.14.2"
env_logger = "0.11.11"
function_name = "0.3.0"
http-body = "1.1.0"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = "0.7"
tower-http = { version = "0.7.1", features = ["cors"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
serde_json = "1.0.151"
novasound-application = { path = "code/crates/application" }
novasound-domain = { path = "code/crates/domain" }
novasound-storage-postgres = { path = "code/crates/storage-postgres" }

[build-dependencies]
connectrpc-build = "0.9.0"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
missing_panics_doc = "warn"
wildcard_imports = "warn"
pedantic = "warn"
