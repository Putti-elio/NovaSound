{% if artists.len() == 0 %}
<p class="status-message">Aucun artiste n'est encore disponible.</p>
{% else %}
<div class="artist-grid">
  {% for artist in artists %}
  <article class="artist-card">
    <p class="eyebrow">Artiste</p>
    <h2>{{ artist.name }}</h2>
  </article>
  {% endfor %}
</div>
{% endif %}
