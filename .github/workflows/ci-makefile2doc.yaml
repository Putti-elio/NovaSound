name: CI Makefile2Doc

on:
    push:
        branches: [main, develop]
        paths:
            - Makefile
            - setup/ci/versions
            - .github/workflows/ci-makefile2doc.yaml
    pull_request:
        branches: [main, develop]
        paths:
            - Makefile
            - setup/ci/versions
            - .github/workflows/ci-makefile2doc.yaml
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    update-doc:
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v6

            - name: Load tool versions
              run: grep -Ev '^\s*(#|$)' setup/ci/versions >> "$GITHUB_ENV"

            - name: Cache makefile2doc binary
              id: cache-makefile2doc
              uses: actions/cache@v4
              with:
                  path: ./makefile2doc
                  key: ${{ runner.os }}-makefile2doc-${{ env.MAKEFILE2DOC_VERSION }}

            - name: Install makefile2doc
              if: steps.cache-makefile2doc.outputs.cache-hit != 'true'
              env:
                  VERSION: ${{ env.MAKEFILE2DOC_VERSION }}
              run: |
                  curl -fsSL -o makefile2doc "https://github.com/Merlin-Clos/makefile2doc/releases/download/${VERSION}/makefile2doc-linux-amd64"
                  chmod +x makefile2doc

            - name: Generate documentation
              run: ./makefile2doc -o docs/MAKEFILE.md

            - name: Commit and push changes
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: "docs: auto-update MAKEFILE.md [skip ci]"
                  file_pattern: docs/MAKEFILE.md
