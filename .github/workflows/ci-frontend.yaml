name: CI Frontend

on:
  push:
    branches: [main, develop]
    paths: [frontend/**]
  pull_request:
    branches: [main, develop]
    paths: [frontend/**]

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load tool versions
        run: cat .ci/ci-versions | grep -v '^#' | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # TODO: Add Nuxt support when switching from Vue.js to Nuxt
      # - name: Nuxt typecheck
      #   run: bun run typecheck
      # - name: Nuxt lint
      #   run: bun run lint
