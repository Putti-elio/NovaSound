name: CI Rust

on:
  push:
    branches: [main, develop]
    paths: [backend/**]
  pull_request:
    branches: [main, develop]
    paths: [backend/**]

permissions:
  contents: read

jobs:
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load tool versions
        run: cat setup/ci/versions | grep -v '^#' | grep -v '^\s*

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Rustfmt check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load tool versions
        run: cat .ci/ci-versions | grep -v '^#' | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Run tests
        run: cargo test

  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load tool versions
        run: cat .ci/ci-versions | grep -v '^#' | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Build release
        run: cargo build --release >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Rustfmt check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load tool versions
        run: cat setup/ci/versions | grep -v '^#' | grep -v '^\s*

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Run tests
        run: cargo test

  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Load tool versions
        run: cat .ci/ci-versions | grep -v '^#' | grep -v '^\s*$' >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Build release
        run: cargo build --release
