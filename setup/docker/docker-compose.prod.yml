services:
  backend:
    build:
      dockerfile: setup/docker/images/backend/Dockerfile.prod
    image: novasound/backend-prod:${TAG:-latest}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - backend_data:/app/data
    ports:
      - "4000:4000"
    command: ["/app/rust"]

  postgres_db:
    build:
      dockerfile: setup/docker/images/postgres/Dockerfile.prod
    image: novasound/db-prod:${TAG:-latest}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql

volumes:
  backend_data:
  postgres_data:
