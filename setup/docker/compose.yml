services:
  backend:
    build:
      context: ../../backend
      dockerfile: ./backend/Dockerfile.dev
    volumes:
      - ../../backend:/app
    ports:
      - "4000:4000"
    command: ["sleep", "infinity"]

  vuejs:
    build:
      context: ../../frontend
      dockerfile: ./frontend/Dockerfile.dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - path: ../../frontend/src
          target: /app/src
          action: sync
        - path: ../../frontend/package.json
          target: /app/package.json
          action: restart
        - path: ../../frontend/vite.config.ts
          target: /app/vite.config.ts
          action: restart      
    command: ["npm", "run", "dev"]
